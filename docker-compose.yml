services:
  app:
    build:  .
    container_name: quizler-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped
  
  mongo:
    image: mongo:6
    container_name: quizler-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    
volumes:
  mongo-data: